name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # test_risk_management.py solves a CVaR model with the GLPK solver
      - name: Install GLPK solver
        run: |
          sudo apt-get update
          sudo apt-get install -y glpk-utils
      # pytest runs both suites named in pyproject testpaths: tests/ (core
      # toolbox packages — core deps only) and
      # energy_optimization_challenge/tests. The energy suite's dependencies
      # (pyomo, pulp, seaborn, scikit-learn) are declared in the `energy` extra
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,energy]"
      - name: Run tests
        run: python -m pytest -q

  # The vision/automation extras pull in torch and selenium, which are too
  # heavy for the full matrix above. This single-version job installs them
  # and runs the vision/automation tests for real; in the matrix job those
  # same tests skip via importorskip, and only the pure-stdlib helpers run.
  extras-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with vision and automation extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vision,automation]"
      - name: Run vision/automation tests
        run: python -m pytest -q tests/test_vision_automation.py
