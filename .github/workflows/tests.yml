name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # test_risk_management.py solves a CVaR model with the GLPK solver
      - name: Install GLPK solver
        run: |
          sudo apt-get update
          sudo apt-get install -y glpk-utils
      # the energy_optimization_challenge suite's dependencies (pyomo, pulp,
      # seaborn, scikit-learn) are declared in the `energy` extra
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,energy]"
      - name: Run tests
        run: python -m pytest -q
