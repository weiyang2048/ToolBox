[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox"
version = "0.1.0"
description = "Reusable tools for data science and machine learning workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wei Yang", email = "weiyang2048@gmail.com" }]
keywords = [
    "data-science",
    "machine-learning",
    "fourier",
    "signal-processing",
    "audio",
    "image-processing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "lxml>=5.0.0",
    "yfinance>=0.2.66",
]

[project.optional-dependencies]
vision = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "pillow>=10.0.0",
    "tqdm>=4.65.0",
]
automation = [
    "selenium>=4.0.0",
    "webdriver-manager>=3.8.0",
    "loguru>=0.6.0",
    "beautifulsoup4>=4.12.0",
    "click>=8.0.0",
]
notebook = [
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
    "noisereduce>=3.0.0",
]
energy = [
    "pyomo>=6.0.0",
    "pulp>=2.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.2.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Repository = "https://github.com/weiyang2048/ToolBox"

[tool.setuptools.packages.find]
where = ["."]
include = ["toolbox*", "energy_optimization_challenge*"]

[tool.pytest.ini_options]
testpaths = ["energy_optimization_challenge/tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
