[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox"
version = "0.1.0"
description = "Reusable tools for data science and machine learning workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wei Yang", email = "weiyang2048@gmail.com" }]
keywords = [
    "data-science",
    "machine-learning",
    "fourier",
    "signal-processing",
    "audio",
    "image-processing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "plotly>=5.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "lxml>=5.0.0",
    "yfinance>=0.2.66",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
vision = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "pillow>=10.0.0",
    "tqdm>=4.65.0",
]
automation = [
    "selenium>=4.0.0",
    "webdriver-manager>=3.8.0",
    "loguru>=0.6.0",
    "beautifulsoup4>=4.12.0",
    "click>=8.0.0",
]
notebook = [
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
    "noisereduce>=3.0.0",
]
energy = [
    "pyomo>=6.0.0",
    "pulp>=2.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.2.0",
]
quantstats = [
    "quantstats>=0.0.81",
]
audio = [
    "faster-whisper>=1.0",
]
nlp = [
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "spacy>=3.8,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
dev = [
    "pytest>=7.0.0",
    "ruff==0.17.3",
]

[project.urls]
Repository = "https://github.com/weiyang2048/ToolBox"

[tool.setuptools.packages.find]
where = ["."]
include = ["toolbox*", "energy_optimization_challenge*"]

# Package data the market modules read by path at runtime
# (wordcloud_terms.json for news_cloud, midterm_paths.csv
# for midterm). Without this, setuptools ships neither file
# in the wheel or the sdist and the modules break installed.
[tool.setuptools.package-data]
"toolbox.DataZoo.market" = ["*.json", "*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests", "energy_optimization_challenge/tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

# Incremental adoption (started 2026-11-01): only the set below is
# enforced (CI lint job). Widen in small batches; the
# behavior-sensitive E722/BLE001 narrowing goes per package, with tests.
# UP031 added 2026-11-02 for the modules converted that day.
# PLW1510 added 2026-11-04: every subprocess.run now spells check=False.
# UP032 added 2026-11-05: every .format call in the tested modules is
# an f-string (the SVG %-template modules keep UP031 ignored above;
# they carry no .format calls).
# BLE001/E722 added 2026-11-09 (user-approved nightly proposal):
# the blind-except audit of 2026-11-06 left every remaining site
# carrying a targeted noqa, and the repo has no bare excepts —
# enforcement starts from zero violations.
# B/EM/C4 added 2026-11-14: the same-day dossiers cleared Bugbear
# 35 -> 4 documented keeps (exceptions below), EM 45 -> 0 and C4
# 73 -> 0, so enforcement starts from zero violations in EM/C4 and
# the four excepted B sites.
# PLR0124 added 2026-11-15 (user-approved nightly proposal): the
# NaN self-comparison idiom (x != x) was zeroed twice and regressed
# once for lack of a CI net; enforcement starts from zero violations.
# DTZ added 2026-11-15: the DTZ dossier (2026-11-14) traced all 19
# hits as keeps — date-only by construction, closed naive systems,
# one guarded parse — so enforcement starts from 19 per-site noqa
# exceptions, each carrying its dossier reason.
# TRY003/TRY300/PLR5501/PLR0402 added 2026-11-15 (idea search #6):
# all four measured zero today — TRY003 was closed as a clean
# negative by its audit (the tree's only raises inside except
# handlers are chained), the other three never fired — so, like
# PLR0124, they are enforced purely as a regression net, starting
# from zero violations.
[tool.ruff.lint]
select = ["F401", "F841", "I001", "UP006", "UP035", "UP045", "UP031", "UP032", "PLW1510", "BLE001", "E722", "B", "EM", "C4", "PLR0124", "DTZ", "TRY003", "TRY300", "PLR5501", "PLR0402"]

[tool.ruff.lint.per-file-ignores]
# Intentional public re-exports (the energy package's API surface).
"energy_optimization_challenge/__init__.py" = ["F401"]
# Percent-format stays in the SVG chart modules: their templates are
# dense with literal % / %% escapes and CSS braces, where %-formatting
# is the clearer, safer spelling; and in the stdlib-only proxy script,
# which must stay directly executable (restyle is cosmetic there).
"toolbox/DataZoo/market/svg_charts.py" = ["UP031"]
"toolbox/DataZoo/market/the_dollar.py" = ["UP031"]
"toolbox/DataZoo/market/us_xus.py" = ["UP031"]
"toolbox/DataZoo/market/ialt_tab.py" = ["UP031"]
"toolbox/net/ssh_proxy_connect.py" = ["UP031"]
# Bugbear dossier keeps (2026-11-14): the _trail closure in
# merged_stats is defined and called three times within the same
# loop iteration and never escapes it, so the loop variable it
# captures cannot be observed rebound — benign as written.
"toolbox/strategies.py" = ["B023"]
# Bugbear dossier keep (2026-11-14): _openfigi_map zips the request
# batch with the OpenFIGI response body — an external API contract,
# positionally paired, so a short response can only leave tail
# CUSIPs unmapped (the function's chosen degrade-and-warn outcome);
# strict=True would raise outside the guarded try block.
"toolbox/DataZoo/market/edgar_13f.py" = ["B905"]
